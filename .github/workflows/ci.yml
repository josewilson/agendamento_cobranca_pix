name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvn test roda a suite inteira, inclusive ArchitectureTest (ArchUnit) e os *RepositoryAdapterIT
      # (Testcontainers - o runner do GitHub Actions ja vem com Docker disponivel).
      - name: Rodar testes
        run: mvn -B test

      - name: Build da imagem Docker
        run: docker build -t agendamento-com-cobranca-pix:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          # vite@8/vitest@5/eslint@10 exigem Node >=22.12 - Node 20 (usado antes do upgrade
          # dessas dependencias) nao e mais suportado.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
