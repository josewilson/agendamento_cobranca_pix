spring:
  application:
    name: agendamento-com-cobranca-pix
  datasource:
    url: jdbc:postgresql://localhost:5432/agendamento
    username: agendamento
    password: agendamento
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

pagamento:
  gateway: ${PAGAMENTO_GATEWAY:asaas}

asaas:
  base-url: https://api-sandbox.asaas.com/v3
  api-key: ${ASAAS_API_KEY:}
  webhook-token: ${ASAAS_WEBHOOK_TOKEN:}

mercadopago:
  base-url: https://api.mercadopago.com
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}

agendamento:
  expiracao:
    intervalo-ms: 60000

notificacao:
  email:
    remetente: ${EMAIL_REMETENTE:no-reply@agendamento.local}

google-calendar:
  base-url: https://www.googleapis.com/calendar/v3
  calendar-id: ${GOOGLE_CALENDAR_ID:primary}
  credenciais-json: ${GOOGLE_CALENDAR_CREDENTIALS:}
  token-server-uri: ${GOOGLE_CALENDAR_TOKEN_SERVER_URI:https://oauth2.googleapis.com/token}

twilio:
  base-url: https://api.twilio.com/2010-04-01
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  sms-from: ${TWILIO_SMS_FROM:}
  whatsapp-from: ${TWILIO_WHATSAPP_FROM:+14155238886}

# requestId vem do MDC (CorrelationIdFilter, adapter/in/web/logging/) — junta todas as linhas
# de log de uma mesma requisicao (ou do processamento assincrono de um evento de dominio que
# ela disparou), ate aqui impossivel de rastrear. Achado de auditoria de observabilidade
# (02/10/2026).
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-sem-id}] %logger{36} - %msg%n"

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# "secure: false" e "same-site: lax" sao os defaults certos pra rodar em http://localhost (o
# browser recusa um cookie "secure" fora de HTTPS, o que quebraria o login local). Ao sair de
# localhost para um ambiente real por HTTPS, ligar SESSION_COOKIE_SECURE=true — o cookie CSRF
# (XSRF-TOKEN) segue os mesmos dois valores, ver SecurityConfig. Achado de auditoria de
# seguranca (02/10/2026).
server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

# So /health e /prometheus expostos por padrao (liveness/readiness pra orquestrador + metricas
# pra scraping) — os demais endpoints do Actuator (env, beans, etc.) vazam detalhe de
# implementacao e nao tem por que ficar publicos num projeto sem autenticacao de operador
# separada.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  health:
    # spring-boot-starter-mail registra um health check que tenta conectar no SMTP configurado —
    # mas e-mail e uma integracao opcional aqui (a aplicacao sobe e funciona normalmente sem SMTP
    # configurado, ver CLAUDE.md), entao um SMTP fora do ar nao deveria derrubar o /health da
    # aplicacao inteira. O mesmo vale pra mail: desabilitado, os demais indicadores (db, disco)
    # continuam ativos.
    mail:
      enabled: false

---
# Perfil dev: usado SÓ pelos testes (ver specs/04-roadmap.md) — nunca para rodar a aplicação
# de verdade, que deve sempre usar o perfil padrão com Postgres real (docker-compose up -d).
# Tudo em memória (ver adapter/out/*/memory), entao nem Postgres nem Flyway sao necessarios
# nesse perfil. Sem esta exclusao a aplicacao ainda tentaria abrir uma conexao JDBC no
# startup (HikariCP/Flyway rodam antes de qualquer bean de negocio), mesmo sem nenhum
# repositorio JPA realmente em uso.
spring:
  config:
    activate:
      on-profile: dev
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
