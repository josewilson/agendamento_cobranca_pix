spring:
  application:
    name: agendamento-com-cobranca-pix
  datasource:
    url: jdbc:postgresql://localhost:5432/agendamento
    username: agendamento
    password: agendamento
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

pagamento:
  gateway: ${PAGAMENTO_GATEWAY:asaas}

asaas:
  base-url: https://api-sandbox.asaas.com/v3
  api-key: ${ASAAS_API_KEY:}
  webhook-token: ${ASAAS_WEBHOOK_TOKEN:}

mercadopago:
  base-url: https://api.mercadopago.com
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}

agendamento:
  expiracao:
    intervalo-ms: 60000

notificacao:
  email:
    remetente: ${EMAIL_REMETENTE:no-reply@agendamento.local}
